services:
  # Express Backend Service
  - type: web
    name: routeless-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_ORIGIN
        value: '*'

  # React Frontend Static Site
  - type: web
    name: routeless-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: 'false'
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: routeless-backend
          envVarKey: RENDER_EXTERNAL_URL

